[project]
name = "newswatch"
version = "0.1.0"
description = "Continuous topic-monitoring agent: RSS -> events -> triage -> cited daily brief"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
newswatch = "newswatch.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes, I = import sorting, UP = modern syntax, B = bugbear, SIM = simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
